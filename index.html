<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solado y alicatado</title><style>
:root { --page:#faf7f2; --card:#ffffff; --ink:#2b2620; --ink2:#6b6353; --line:#e8e0d2; --accent:#6b4f1d; --warn-bg:#fdf3e3; --warn-line:#d99a2b; --note-bg:#eef5ee; --note-line:#7ba05b; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--page); color: var(--ink); font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 16px; line-height: 1.55; }
.wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }
.portada { text-align: center; margin: 10px 0 4px; }
.portada img { width: 240px; max-width: 74%; height: auto; }
.portada h1 { font-size: 25px; margin: 14px 0 2px; line-height: 1.2; }
.fact { color: var(--ink2); font-size: 13px; }
.intro { color: var(--ink2); margin: 10px 0 18px; }
.cab { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
.cab img { height: 40px; width: auto; }
.cab h1 { font-size: 21px; margin: 0; line-height: 1.25; }
.callout { border-radius: 12px; padding: 12px 16px; margin: 14px 0; font-size: 14.5px; }
.callout b { display: block; margin-bottom: 2px; }
.note { background: var(--note-bg); border: 2px solid var(--note-line); }
.warn { background: var(--warn-bg); border: 2px solid var(--warn-line); }
.seccion { margin-top: 22px; }
.seccion > h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink2); margin: 0 0 10px; font-weight: 600; }
.datos { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
.datos div { display: flex; gap: 10px; padding: 4px 0; }
.datos b { flex: none; min-width: 110px; color: var(--accent); font-size: 14px; }
input[type=search] { width: 100%; padding: 12px 14px; font-size: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); }
.cats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.cats button { padding: 9px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink2); font-size: 13.5px; cursor: pointer; }
.cats button.sel { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.ficha-card { display: block; text-decoration: none; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; margin-bottom: 16px; }
.ficha-card img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: #f5efe4; }
.ficha-card-body { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px 16px; }
.ficha-num { flex: none; font-weight: 700; color: var(--accent); font-size: 18px; }
.ficha-title { font-weight: 600; font-size: 16.5px; }
.ficha-meta { margin-top: 2px; color: var(--ink2); font-size: 12.5px; }
.vacio { color: var(--ink2); font-size: 14.5px; padding: 8px 2px; }
.ficha-img { display: block; width: 100%; border-radius: 16px; border: 1px solid var(--line); background: #f5efe4; margin-top: 14px; }
.paso { display: flex; gap: 12px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
.paso-num { flex: none; font-weight: 700; color: var(--accent); }
.paso p { margin: 0; flex: 1; }
.btn-hecho { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--page); color: var(--ink2); font-size: 13.5px; cursor: pointer; }
.btn-hecho.sel { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.opcion { display: block; width: 100%; text-align: left; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 15px; cursor: pointer; margin-bottom: 8px; }
.opcion.sel { border-color: var(--accent); background: var(--warn-bg); }
.btn-sol { padding: 10px 18px; border-radius: 10px; border: 1px solid var(--accent); background: var(--card); color: var(--accent); font-size: 14.5px; font-weight: 600; cursor: pointer; margin-top: 6px; }
.caption { color: var(--ink2); font-size: 12.5px; margin-top: 8px; }
.volver { display: inline-block; margin-top: 18px; padding: 10px 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); text-decoration: none; font-size: 14.5px; }
.pie { margin-top: 30px; color: var(--ink2); font-size: 12.5px; border-top: 1px solid var(--line); padding-top: 14px; }
.visual{position:relative;display:block;overflow:hidden;border-radius:16px}.visual img{width:100%;display:block}.legacy img{clip-path:inset(0 0 11% 0);margin-bottom:-8.25%;aspect-ratio:4 / 3;object-fit:cover}.visual::after{content:'';position:absolute;left:2.5%;bottom:3%;width:8.5%;max-width:85px;aspect-ratio:82 / 83;background:url('img/marca.png') center / contain no-repeat;pointer-events:none}.ficha-img{margin:0;border:0}.fuentes{font-size:13px;color:var(--ink2);margin:18px 0}.fuentes a{color:var(--accent);overflow-wrap:anywhere}.cab{flex-direction:column;align-items:flex-start}.cab img{height:auto;width:110px}.datos div{flex-wrap:wrap}.datos b{min-width:0}.btn-hecho{font-size:15px;padding:11px 16px}.ya{font-size:13px;color:#4d7a2e;font-weight:600}.ficha-card 
.paso{flex-wrap:wrap}.paso p{min-width:180px}.paso .btn-hecho{margin-left:auto}.ficha-card .visual img{object-fit:contain}.visual{background:#f7f0df}.visual::after{width:8%;max-width:64px}.cab img{width:160px}.datos div{display:block}.datos b{display:block}.paso-num{font-size:16px}.ficha-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}@media(max-width:420px){.cab h1{font-size:21px}.ej-nav{flex-wrap:wrap}}.visual:not(.legacy)::after{display:none}@media(max-width:420px){.paso{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px}.paso p{min-width:0}.paso .btn-hecho{grid-column:2;justify-self:end}}</style></head><body><main id="app" class="wrap"></main><script src="data.js"></script><script src="app.js"></script><script src="ejercicios.js"></script></body></html>
